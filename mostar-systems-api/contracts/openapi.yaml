openapi: 3.1.0
info:
  title: MoStar Systems API
  version: 0.1.0
  description: MoScripts-first geospatial and weather API.
servers:
  - url: https://api.mostarsystems.com
    description: Production
paths:
  /health:
    get:
      operationId: health
      responses:
        '200':
          description: Service health
  /v1/weather/current:
    get:
      operationId: currentWeather
      parameters:
        - {name: lat, in: query, required: true, schema: {type: number, minimum: -90, maximum: 90}}
        - {name: lon, in: query, required: true, schema: {type: number, minimum: -180, maximum: 180}}
      responses:
        '200': {description: Current weather}
  /v1/weather/wind:
    get:
      operationId: windField
      parameters:
        - {name: bbox, in: query, required: true, schema: {type: string}}
        - {name: time, in: query, required: false, schema: {type: string, format: date-time}}
        - {name: resolution, in: query, required: false, schema: {type: number, default: 0.25}}
      responses:
        '200': {description: Normalized vector wind field}
        '413': {description: Requested bounding box exceeds server limit}
  /v1/weather/forecast:
    get:
      operationId: weatherForecast
      parameters:
        - {name: lat, in: query, required: true, schema: {type: number}}
        - {name: lon, in: query, required: true, schema: {type: number}}
        - {name: hours, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 168, default: 72}}
      responses:
        '200': {description: Weather forecast}
  /v1/geo/alerts:
    get:
      operationId: geoAlerts
      responses:
        '200': {description: Geospatial alerts}
  /v1/geo/alerts/live:
    get:
      operationId: liveGeoAlerts
      description: Upgrade connection to WebSocket for live alert stream.
      responses:
        '101': {description: Switching Protocols}
  /v1/satellite/imagery:
    get:
      operationId: satelliteImagery
      parameters:
        - {name: lat, in: query, required: true, schema: {type: number}}
        - {name: lon, in: query, required: true, schema: {type: number}}
        - {name: zoom, in: query, required: false, schema: {type: integer, default: 10}}
      responses:
        '200': {description: Satellite imagery descriptor}
